<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title1 %}{{ t["base_index_title1"] }}{% endblock %}</title>
    <!-- Link the built CSS and JS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='dist/style.css') }}">
    <script src="{{ url_for('static', filename='js/no_flicker.js') }}"></script>
</head>

<body class="bg-gray-50 dark:bg-gray-900 dark:text-gray-100 min-h-screen flex items-center justify-center px-4 py-8">
    <div class="max-w-lg w-full bg-white dark:bg-gray-800 dark:border-gray-600 shadow-md rounded-lg p-8 space-y-6">
        <h1 class="text-2xl font-bold text-blue-700 dark:text-blue-300">{% block title2 %}{{ t["base_index_title2"] }}{% endblock %}</h1>
        {% block content %}
        <!-- Child templates inject their unique content here -->
        {% endblock %}
    </div>
    <script src="{{ url_for('static', filename='js/dark_mode.js') }}"></script>
</body>
</html>
